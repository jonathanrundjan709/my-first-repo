<title>Calorie Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: glassmorphism. Blurred color blobs behind everything; every section is a frosted translucent card with a hairline light border. Ring hero, glass meal cards, glass week chart, floating glass dock and sheet. */
:root {
  --bg: #0b0a1f; --fg: #f5f4ff; --muted: rgba(235,233,255,.62);
  --glass: rgba(255,255,255,.09); --glass-strong: rgba(255,255,255,.14); --glass-line: rgba(255,255,255,.2); --line: rgba(255,255,255,.12);
  --shadow: 0 10px 40px rgba(0,0,0,.35);
  --a1: #7c5cff; --a2: #19d3ff; --blob1: #6d3bff; --blob2: #ff4fa3; --blob3: #14c8ff;
  --over: #ff6b8a; --on-accent: #ffffff; --scrim: rgba(8,6,30,.55); --track: rgba(255,255,255,.12);
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eef0ff; --fg: #1b1840; --muted: rgba(27,24,64,.6);
    --glass: rgba(255,255,255,.55); --glass-strong: rgba(255,255,255,.75); --glass-line: rgba(255,255,255,.9); --line: rgba(27,24,64,.1);
    --shadow: 0 10px 40px rgba(80,60,180,.16);
    --a1: #6d4aff; --a2: #08a9e0; --blob1: #a99bff; --blob2: #ffa6cf; --blob3: #8fe3ff;
    --over: #e0345c; --scrim: rgba(60,50,120,.3); --track: rgba(27,24,64,.1); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eef0ff; --fg: #1b1840; --muted: rgba(27,24,64,.6);
  --glass: rgba(255,255,255,.55); --glass-strong: rgba(255,255,255,.75); --glass-line: rgba(255,255,255,.9); --line: rgba(27,24,64,.1);
  --shadow: 0 10px 40px rgba(80,60,180,.16);
  --a1: #6d4aff; --a2: #08a9e0; --blob1: #a99bff; --blob2: #ffa6cf; --blob3: #8fe3ff;
  --over: #e0345c; --scrim: rgba(60,50,120,.3); --track: rgba(27,24,64,.1); color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.4; position: relative; min-height: 100vh;
  padding-block: 18px 130px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bg { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .75; }
.bg i:nth-child(1) { width: 62vmax; height: 62vmax; max-width: 520px; max-height: 520px; background: var(--blob1); top: -12%; left: -18%; animation: drift 18s ease-in-out infinite alternate; }
.bg i:nth-child(2) { width: 54vmax; height: 54vmax; max-width: 460px; max-height: 460px; background: var(--blob2); top: 30%; right: -22%; animation: drift 22s ease-in-out infinite alternate-reverse; }
.bg i:nth-child(3) { width: 50vmax; height: 50vmax; max-width: 420px; max-height: 420px; background: var(--blob3); bottom: -14%; left: 10%; animation: drift 26s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate(40px, -30px) scale(1.12); } }
main { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; transition: transform .15s, opacity .15s; }
button:active { transform: scale(.97); opacity: .75; }
:focus-visible { outline: 2px solid var(--a2); outline-offset: 3px; }
.num { font-variant-numeric: tabular-nums; }
.glass { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 26px; box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.18);
  -webkit-backdrop-filter: blur(26px) saturate(170%); backdrop-filter: blur(26px) saturate(170%); }
.label { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

.top { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px 2px; }
.top h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
.top .date { color: var(--muted); font-weight: 500; }
.nav { display: flex; gap: 8px; }
.nav button { width: 40px; height: 40px; border-radius: 50%; font-size: 20px; display: grid; place-items: center; background: var(--glass); border: 1px solid var(--glass-line); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); }
.nav button:disabled { opacity: .3; }

.hero { padding: 24px 18px 18px; }
.ring { position: relative; width: 210px; height: 210px; margin: 0 auto 20px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .big { font-size: 54px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.ring .big.over { color: var(--over); }
.ring .small { color: var(--muted); font-weight: 500; margin-top: 6px; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats3 > div { background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 12px 8px; text-align: center; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stats3 b, .stats3 input { font-size: 20px; font-weight: 700; }
.stats3 input { width: 100%; text-align: center; border: 0; background: none; padding: 0; outline: none; -moz-appearance: textfield; color: var(--a2); }
.stats3 input::-webkit-outer-spin-button, .stats3 input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.macros > div { background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 10px 8px; text-align: center; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.macros b { font-size: 18px; font-weight: 700; }
.macros small { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.macros .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.dot.p { background: #ff6fae; } .dot.c { background: #ffc857; } .dot.f { background: #5be3c3; }
.mline { color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 0; text-transform: none; }
.row { flex-wrap: wrap; }
.row .sub { flex-basis: 100%; color: var(--muted); font-size: 12px; margin-top: -8px; }
.mfields { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.mfields label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mfields input { width: 100%; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 14px; padding: 12px; font-size: 16px; font-weight: 500; color: var(--fg); outline: none; text-transform: none; letter-spacing: 0; }
.hint { color: var(--muted); font-size: 13px; margin: 12px 2px 0; }
#textout { margin-top: 14px; }
#textout .scan-actions { margin-bottom: 12px; }
.sec-title { margin: 10px 4px -4px; font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
.group { padding: 8px 18px 6px; }
.group-head { display: flex; justify-content: space-between; padding: 10px 0 6px; }
.row { display: flex; align-items: baseline; gap: 12px; width: 100%; text-align: left; padding: 13px 0; border-top: 1px solid var(--line); }
.row .name { flex: 1; min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.row .kcal { color: var(--muted); font-weight: 600; }
.row .del { display: none; color: var(--over); font-weight: 700; }
.row.open .del { display: block; }
.row.open .kcal { display: none; }
.empty { padding: 30px 18px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-size: 18px; margin-bottom: 4px; }

.weekcard { padding: 18px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; height: 120px; }
.bar-col { min-width: 0; }
.bar-col button { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
.track { width: 100%; max-width: 26px; height: 100%; background: var(--track); border-radius: 13px; display: flex; align-items: flex-end; overflow: hidden; }
.fill { width: 100%; border-radius: 13px; background: linear-gradient(180deg, var(--a2), var(--a1)); min-height: 6px; transition: height .5s cubic-bezier(.3,1.2,.5,1); }
.fill.over { background: linear-gradient(180deg, #ffb199, var(--over)); }
.fill.none { background: transparent; }
.bar-col.sel .track { box-shadow: 0 0 0 1.5px var(--a2); }
.wk-labels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 10px; text-align: center; font-size: 12px; color: var(--muted); font-weight: 600; }
.wk-labels .sel { color: var(--fg); }
.avg { color: var(--muted); margin-top: 14px; text-align: center; }
.sync { color: var(--muted); font-size: 12px; text-align: center; padding-bottom: 8px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dock-in { pointer-events: auto; display: flex; gap: 8px; width: 100%; max-width: 520px; padding: 8px; border-radius: 34px; }
.pill { display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 26px; font-weight: 700; cursor: pointer; }
.pill svg { width: 20px; height: 20px; }
.pill.main { flex: 1; background: linear-gradient(135deg, var(--a1), var(--a2)); color: var(--on-accent); box-shadow: 0 6px 20px rgba(110,80,255,.45); }
.pill.ghost { padding: 0 22px; background: var(--glass-strong); border: 1px solid var(--glass-line); }

.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .25s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; display: flex; justify-content: center; transform: translateY(105%); transition: transform .4s cubic-bezier(.3,.9,.3,1); pointer-events: none; }
.sheet-in { pointer-events: auto; width: 100%; max-width: 520px; border-radius: 30px 30px 0 0; border-bottom: 0; padding: 12px max(18px, env(safe-area-inset-left, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 90%; overflow-y: auto;
  background: var(--glass-strong); -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%); }
body.sheet-open .scrim { opacity: 1; pointer-events: auto; }
body.sheet-open .sheet { transform: none; pointer-events: auto; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--glass-line); margin: 0 auto 14px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.sheet-head h3 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.link { color: var(--a2); font-weight: 600; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; background: var(--glass); border: 1px solid var(--glass-line); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 500; }
.chip span { color: var(--muted); margin-left: 6px; }
.fields { background: var(--glass); border: 1px solid var(--glass-line); border-radius: 20px; overflow: hidden; }
.field { display: flex; align-items: center; gap: 12px; padding: 0 16px; }
.field + .field { border-top: 1px solid var(--line); }
.field label { width: 74px; flex: none; color: var(--muted); font-size: 13px; font-weight: 600; }
.field input { flex: 1; min-width: 0; border: 0; background: none; padding: 16px 0; outline: none; font-size: 17px; font-weight: 500; }
.field input::placeholder { color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 16px 0; padding: 4px; background: var(--glass); border: 1px solid var(--line); border-radius: 16px; }
.seg button { padding: 9px 0; border-radius: 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: linear-gradient(135deg, var(--a1), var(--a2)); color: var(--on-accent); }
.cta { display: block; width: 100%; background: linear-gradient(135deg, var(--a1), var(--a2)); color: var(--on-accent); border-radius: 26px; height: 52px; font-weight: 700; box-shadow: 0 6px 20px rgba(110,80,255,.4); }
.cta.alt { background: var(--glass); border: 1px solid var(--glass-line); color: var(--fg); box-shadow: none; }
.scan-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 20px; margin-bottom: 14px; }
.scan-status { color: var(--muted); text-align: center; padding: 14px 0; }
.scan-status.err { color: var(--over); }
.spinner { width: 24px; height: 24px; border-radius: 50%; border: 3px solid var(--track); border-top-color: var(--a2); margin: 0 auto 10px; animation: spin .8s linear infinite; }
.scan-item input.k { flex: none; width: 70px; text-align: right; color: var(--muted); }
.scan-item input.g { width: 54px; color: var(--fg); }
.scan-item .del { color: var(--over); font-size: 20px; }
.scan-actions { display: grid; gap: 10px; margin-top: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <div class="top">
    <div><h1 id="title">Today</h1><div class="date" id="eyebrow"></div></div>
    <div class="nav">
      <button id="prev" aria-label="Previous day">&#8249;</button>
      <button id="next" aria-label="Next day">&#8250;</button>
    </div>
  </div>

  <section class="glass hero" aria-label="Daily summary">
    <div class="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--a2)"/><stop offset="1" stop-color="var(--a1)"/></linearGradient></defs>
        <circle cx="60" cy="60" r="50" fill="none" stroke="var(--track)" stroke-width="12"/>
        <circle id="arc" cx="60" cy="60" r="50" fill="none" stroke="url(#grad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16" style="transition:stroke-dashoffset .9s cubic-bezier(.3,1.1,.5,1)"/>
      </svg>
      <div class="center"><div class="big num" id="remaining">2,000</div><div class="small" id="remlabel">kcal left</div></div>
    </div>
    <div class="stats3">
      <div><span class="label">Eaten</span><b class="num" id="eaten">0</b></div>
      <div><span class="label">Goal</span><input id="goal" type="number" inputmode="numeric" min="500" max="10000" step="50" aria-label="Daily goal in kcal"></div>
      <div><span class="label">Meals</span><b class="num" id="count">0</b></div>
    </div>
    <div class="macros" aria-label="Macros eaten">
      <div><small><i class="dot p"></i>Protein</small><b class="num"><span id="mp">0</span>g</b></div>
      <div><small><i class="dot c"></i>Carbs</small><b class="num"><span id="mc">0</span>g</b></div>
      <div><small><i class="dot f"></i>Fat</small><b class="num"><span id="mf">0</span>g</b></div>
    </div>
  </section>

  <h2 class="sec-title" id="logtitle">Today</h2>
  <div id="log" style="display:flex;flex-direction:column;gap:12px"></div>

  <h2 class="sec-title">Last 7 days</h2>
  <section class="glass weekcard">
    <div class="week" id="week"></div>
    <div class="wk-labels" id="wklabels"></div>
    <div class="avg num" id="avg"></div>
  </section>
  <div class="sync" id="sync">Saved on this device only</div>
</main>

<div class="dock"><div class="dock-in glass">
  <label class="pill ghost" id="scantab" for="photo" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>Scan
  </label>
  <button class="pill main" id="addtab" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add food
  </button>
</div></div>
<input id="photo" type="file" accept="image/*" hidden>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" aria-hidden="true"><div class="sheet-in glass" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div id="panel-add">
    <div class="sheet-head"><h3>Add food</h3><button class="link" type="button" data-close>Cancel</button></div>
    <div class="chips" id="chips"></div>
    <form id="form">
      <div class="fields">
        <div class="field"><label for="food">Food</label><input id="food" placeholder="What did you eat?" required maxlength="80" autocomplete="off"></div>
      </div>
      <div id="manual">
      <div class="fields" style="margin-top:10px"><div class="field"><label for="cal">Calories</label><input id="cal" type="number" inputmode="numeric" min="1" max="5000" placeholder="kcal"></div></div>
      <div class="mfields">
        <label for="pro">Protein (g)<input id="pro" type="number" inputmode="decimal" min="0" max="500" placeholder="0"></label>
        <label for="carb">Carbs (g)<input id="carb" type="number" inputmode="decimal" min="0" max="800" placeholder="0"></label>
        <label for="fat">Fat (g)<input id="fat" type="number" inputmode="decimal" min="0" max="500" placeholder="0"></label>
      </div>
      </div>
      <p class="hint" id="aihint" hidden>Type what you ate, with amounts if you know them. Claude works out the calories, protein, carbs and fat.</p>
      <div id="textout"></div>
      <div class="seg" id="seg" role="group" aria-label="Meal">
        <button type="button" aria-pressed="false">Breakfast</button><button type="button" aria-pressed="false">Lunch</button><button type="button" aria-pressed="false">Dinner</button><button type="button" aria-pressed="false">Snack</button>
      </div>
      <button class="cta" type="submit" id="submitbtn">Add to log</button>
    </form>
  </div>
  <div id="panel-scan" hidden>
    <div class="sheet-head"><h3>Scan meal</h3><button class="link" type="button" data-close>Close</button></div>
    <div id="scan"></div>
  </div>
</div></div>

<script>
(function () {
  var KEY = "calorie-tracker-v1";
  var MEALS = ["Breakfast", "Lunch", "Dinner", "Snack"];
  var QUICK = [["Egg", 78, 6, 1, 5], ["Banana", 105, 1, 27, 0], ["Rice, 1 cup", 205, 4, 45, 0], ["Chicken breast", 165, 31, 0, 4], ["Apple", 95, 0, 25, 0], ["Coffee with milk", 40, 2, 3, 2]];
  var state = { goal: 2000, days: {} };
  try { var raw = localStorage.getItem(KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  var dbRefs = null;
  var aiMode = false;
  var meal = "Breakfast";

  function $(id) { return document.getElementById(id); }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  var todayStr = iso(new Date());
  var current = todayStr;
  function g1(n) { n = Math.round((+n || 0) * 10) / 10; return String(n); }
  function pack(day, e) { return { day: day, name: e.name, kcal: e.kcal, meal: e.meal, p: +e.p || 0, c: +e.c || 0, f: +e.f || 0 }; }
  function macroSum(list) { return list.reduce(function (a, e) { a.p += +e.p || 0; a.c += +e.c || 0; a.f += +e.f || 0; return a; }, { p: 0, c: 0, f: 0 }); }
  function macroText(m) { return "P " + g1(m.p) + "g · C " + g1(m.c) + "g · F " + g1(m.f) + "g"; }
  function hasMacros(e) { return (+e.p || 0) + (+e.c || 0) + (+e.f || 0) > 0; }
  function total(day) { return (state.days[day] || []).reduce(function (a, e) { return a + e.kcal; }, 0); }
  function fmt(n) { return Math.round(n).toLocaleString(); }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function label(day) {
    if (day === todayStr) return "Today";
    var y = new Date(); y.setDate(y.getDate() - 1);
    if (day === iso(y)) return "Yesterday";
    return parse(day).toLocaleDateString(undefined, { weekday: "long" });
  }

  function addEntry(day, e) {
    (state.days[day] = state.days[day] || []).push(e);
    save();
    if (dbRefs) dbRefs.entries.doc(e.id).set(pack(day, e)).catch(function () {});
  }
  function removeEntry(day, id) {
    state.days[day] = (state.days[day] || []).filter(function (x) { return x.id !== id; });
    if (!state.days[day].length) delete state.days[day];
    save();
    if (dbRefs) dbRefs.entries.doc(id).delete().catch(function () {});
  }
  function setGoal(g) {
    state.goal = g; save();
    if (dbRefs) dbRefs.settings.doc("main").set({ goal: g }).catch(function () {});
  }

  function openSheet(panel) {
    $("panel-add").hidden = panel !== "add";
    $("panel-scan").hidden = panel !== "scan";
    document.body.classList.add("sheet-open");
    $("sheet").setAttribute("aria-hidden", "false");
    if (panel === "add") setTimeout(function () { $("food").focus(); }, 350);
  }
  function closeSheet() {
    document.body.classList.remove("sheet-open");
    $("sheet").setAttribute("aria-hidden", "true");
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  $("scrim").onclick = closeSheet;
  document.querySelectorAll("[data-close]").forEach(function (b) { b.onclick = closeSheet; });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeSheet(); });
  $("addtab").onclick = function () { openSheet("add"); };

  var segBtns = $("seg").querySelectorAll("button");
  function setMeal(m) {
    meal = m;
    segBtns.forEach(function (b) { b.setAttribute("aria-pressed", b.textContent === m ? "true" : "false"); });
  }
  segBtns.forEach(function (b) { b.onclick = function () { setMeal(b.textContent); }; });
  var hr = new Date().getHours();
  setMeal(hr < 11 ? "Breakfast" : hr < 15 ? "Lunch" : hr < 20 ? "Dinner" : "Snack");

  QUICK.forEach(function (q) {
    var c = document.createElement("button"); c.type = "button"; c.className = "chip";
    c.textContent = q[0]; var s = document.createElement("span"); s.textContent = q[1]; c.appendChild(s);
    c.onclick = function () { $("food").value = q[0]; if (aiMode) { window.__analyze(q[0]); return; } $("cal").value = q[1]; $("pro").value = q[2]; $("carb").value = q[3]; $("fat").value = q[4]; $("cal").focus(); };
    $("chips").appendChild(c);
  });

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var name = $("food").value.trim(), kcal = parseInt($("cal").value, 10);
    if (aiMode) { if (name && window.__analyze) window.__analyze(name); return; }
    if (!name || !(kcal > 0)) return;
    addEntry(current, { id: newId(), name: name, kcal: kcal, meal: meal, p: parseFloat($("pro").value) || 0, c: parseFloat($("carb").value) || 0, f: parseFloat($("fat").value) || 0 });
    $("food").value = ""; $("cal").value = ""; $("pro").value = ""; $("carb").value = ""; $("fat").value = "";
    closeSheet(); render();
  });

  $("goal").addEventListener("change", function () {
    var g = parseInt($("goal").value, 10);
    if (g >= 500 && g <= 10000) setGoal(g);
    render();
  });
  $("prev").onclick = function () { var d = parse(current); d.setDate(d.getDate() - 1); current = iso(d); render(); };
  $("next").onclick = function () { var d = parse(current); d.setDate(d.getDate() + 1); if (iso(d) <= todayStr) { current = iso(d); render(); } };

  function render() {
    var entries = state.days[current] || [];
    var sum = total(current), goal = state.goal, over = sum > goal;
    $("title").textContent = label(current);
    $("eyebrow").textContent = parse(current).toLocaleDateString(undefined, { month: "short", day: "numeric" });
    $("logtitle").textContent = current === todayStr ? "Today's meals" : label(current) + "'s meals";
    $("next").disabled = current >= todayStr;
    $("eaten").textContent = fmt(sum);
    if (document.activeElement !== $("goal")) $("goal").value = goal;
    $("arc").style.strokeDashoffset = 314.16 * (1 - Math.min(sum / goal, 1));
    $("arc").style.stroke = over ? "var(--over)" : "url(#grad)";
    $("remlabel").textContent = over ? "kcal over" : "kcal left";
    $("remaining").textContent = fmt(Math.abs(goal - sum));
    $("remaining").classList.toggle("over", over);
    $("count").textContent = entries.length;
    var tm = macroSum(entries);
    $("mp").textContent = g1(tm.p); $("mc").textContent = g1(tm.c); $("mf").textContent = g1(tm.f);

    var log = $("log"); log.innerHTML = "";
    if (!entries.length) {
      log.innerHTML = '<div class="empty glass"><b>Nothing logged yet</b>Tap Add food to log your first meal.</div>';
    } else {
      MEALS.forEach(function (m) {
        var items = entries.filter(function (e) { return e.meal === m; });
        if (!items.length) return;
        var g = document.createElement("div"); g.className = "group glass";
        var head = document.createElement("div"); head.className = "group-head label";
        var hl = document.createElement("span"); hl.textContent = m;
        var hr2 = document.createElement("span"); hr2.className = "num";
        hr2.textContent = fmt(items.reduce(function (a, e) { return a + e.kcal; }, 0)) + " kcal";
        head.append(hl, hr2); g.appendChild(head);
        var gm = macroSum(items);
        if (hasMacros(gm)) { var ml = document.createElement("div"); ml.className = "mline"; ml.style.paddingBottom = "8px"; ml.textContent = "Meal total: " + macroText(gm); g.appendChild(ml); }
        items.forEach(function (e) {
          var row = document.createElement("button"); row.type = "button"; row.className = "row";
          row.setAttribute("aria-label", e.name + ", " + e.kcal + " kcal. Tap for delete.");
          var n = document.createElement("span"); n.className = "name"; n.textContent = e.name;
          var k = document.createElement("span"); k.className = "kcal num"; k.textContent = fmt(e.kcal);
          var d = document.createElement("span"); d.className = "del"; d.textContent = "Delete";
          row.append(n, k, d);
          if (hasMacros(e)) { var sb = document.createElement("span"); sb.className = "sub"; sb.textContent = macroText(e); row.appendChild(sb); }
          row.onclick = function () {
            if (row.classList.contains("open")) { removeEntry(current, e.id); render(); }
            else {
              log.querySelectorAll(".row.open").forEach(function (r) { r.classList.remove("open"); });
              row.classList.add("open");
            }
          };
          g.appendChild(row);
        });
        log.appendChild(g);
      });
    }
    renderWeek();
  }

  function renderWeek() {
    var wk = $("week"), wl = $("wklabels"); wk.innerHTML = ""; wl.innerHTML = "";
    var end = parse(current), days = [], i;
    for (i = 6; i >= 0; i--) { var d = new Date(end); d.setDate(d.getDate() - i); days.push(iso(d)); }
    var vals = days.map(total);
    var max = Math.max.apply(null, vals.concat([state.goal]));
    days.forEach(function (day, idx) {
      var v = vals[idx];
      var col = document.createElement("div"); col.className = "bar-col" + (day === current ? " sel" : "");
      var b = document.createElement("button"); b.type = "button";
      b.setAttribute("aria-label", label(day) + ": " + fmt(v) + " kcal");
      var track = document.createElement("div"); track.className = "track";
      var bar = document.createElement("div"); bar.className = "fill" + (v > state.goal ? " over" : v ? "" : " none");
      bar.style.height = v ? Math.max(v / max * 100, 6) + "%" : "0";
      track.appendChild(bar); b.appendChild(track); col.appendChild(b); wk.appendChild(col);
      b.onclick = function () { current = day; render(); };
      var l = document.createElement("span"); if (day === current) l.className = "sel";
      l.textContent = parse(day).toLocaleDateString(undefined, { weekday: "narrow" });
      wl.appendChild(l);
    });
    var logged = vals.filter(function (v) { return v > 0; });
    $("avg").textContent = logged.length
      ? "Average " + fmt(logged.reduce(function (a, b) { return a + b; }, 0) / logged.length) + " kcal on logged days"
      : "Log a few days to see your average.";
  }

  var RULES = "Rules: estimate the weight in grams of each item as served (cooked weight, including batter, sauce and oil). Do not overestimate: one piece of fried fish fillet is about 60 to 100 g, a chicken drumstick about 90 g, a cup of cooked rice about 160 g. Name the food as specifically as you can. When two foods look alike (for example fried fish or fried chicken) pick the most likely one and mention the doubt in note. Understand foods from any cuisine, including Indonesian. Reply with only JSON: {\"items\":[{\"name\":string,\"grams\":number,\"kcal\":integer,\"protein\":number,\"carbs\":number,\"fat\":number}],\"note\":string}. If there is no food, return an empty items array and explain in note.";

  function renderResults(host, res, pic, rerun) {
    function st(msg, err) { var p = document.createElement("div"); p.className = "scan-status" + (err ? " err" : ""); p.textContent = msg; return p; }
    host.textContent = ""; if (pic) host.appendChild(pic);
    var items = (res && res.items || []).filter(function (it) { return it && it.name && it.kcal > 0; });
    if (!items.length) { host.appendChild(st((res && res.note) || "Could not find any food in that.", true)); }
    var fl = document.createElement("div"); fl.className = "fields";
    items.forEach(function (it) {
      var base = { g: +it.grams || 0, kcal: +it.kcal, p: +it.protein || 0, c: +it.carbs || 0, f: +it.fat || 0 };
      var row = document.createElement("div"); row.className = "field scan-item";
      var n = document.createElement("input"); n.value = it.name; n.maxLength = 80; n.setAttribute("aria-label", "Food name");
      var gi = document.createElement("input"); gi.type = "number"; gi.className = "k g"; gi.min = 1; gi.setAttribute("aria-label", "Weight in grams");
      var k = document.createElement("input"); k.type = "number"; k.className = "k"; k.min = 1; k.value = Math.round(base.kcal); k.setAttribute("aria-label", "Calories");
      var x = document.createElement("button"); x.type = "button"; x.className = "del"; x.textContent = "×"; x.setAttribute("aria-label", "Remove item");
      row._m = { p: base.p, c: base.c, f: base.f }; row._g = base.g;
      var mm = document.createElement("div"); mm.className = "mline"; mm.style.cssText = "padding:0 16px 10px"; row._sub = mm;
      function showM() { mm.textContent = hasMacros(row._m) ? macroText(row._m) : ""; mm.hidden = !hasMacros(row._m); }
      if (base.g > 0) {
        gi.value = Math.round(base.g);
        gi.addEventListener("input", function () {
          var g = parseFloat(gi.value); if (!(g > 0)) return;
          var r = g / base.g; row._g = g;
          k.value = Math.round(base.kcal * r);
          row._m = { p: Math.round(base.p * r * 10) / 10, c: Math.round(base.c * r * 10) / 10, f: Math.round(base.f * r * 10) / 10 };
          showM();
        });
      } else { gi.hidden = true; }
      x.onclick = function () { row.remove(); mm.remove(); };
      var gl = document.createElement("span"); gl.className = "mline"; gl.textContent = "g"; gl.hidden = base.g <= 0;
      row.append(n, gi, gl, k, x); fl.appendChild(row); fl.appendChild(mm); showM();
    });
    if (items.length) host.appendChild(fl);
    if (res && res.note) host.appendChild(st(res.note));

    if (rerun) {
      var fix = document.createElement("div"); fix.className = "fields"; fix.style.marginTop = "12px";
      var fr = document.createElement("div"); fr.className = "field";
      var fi = document.createElement("input"); fi.placeholder = "Wrong? Tell me, e.g. it's fried dory, about 80 g"; fi.maxLength = 200; fi.setAttribute("aria-label", "Correction");
      var fb = document.createElement("button"); fb.type = "button"; fb.className = "link"; fb.textContent = "Re-check";
      fr.append(fi, fb); fix.appendChild(fr); host.appendChild(fix);
      var go = async function () {
        var hint = fi.value.trim(); if (!hint) return;
        fb.disabled = true; fb.textContent = "Checking…";
        try { var r2 = await rerun(hint, res); renderResults(host, r2, pic, rerun); }
        catch (e) { fb.disabled = false; fb.textContent = "Re-check"; host.appendChild(st("Could not re-check. Try again.", true)); }
      };
      fb.onclick = go; fi.addEventListener("keydown", function (ev) { if (ev.key === "Enter") { ev.preventDefault(); go(); } });
    }

    if (!items.length) return;
    var acts = document.createElement("div"); acts.className = "scan-actions";
    var addAll = document.createElement("button"); addAll.type = "button"; addAll.className = "cta"; addAll.textContent = "Add to " + meal.toLowerCase();
    addAll.onclick = function () {
      fl.querySelectorAll(".scan-item").forEach(function (row) {
        var ins = row.querySelectorAll("input"), nm = ins[0].value.trim(), kc = parseInt(ins[2].value, 10);
        if (!nm || !(kc > 0)) return;
        if (row._g > 0 && !/\d\s?g\b/i.test(nm)) nm += ", " + Math.round(row._g) + " g";
        addEntry(current, { id: newId(), name: nm, kcal: kc, meal: meal, p: row._m.p, c: row._m.c, f: row._m.f });
      });
      host.textContent = ""; $("food").value = ""; closeSheet(); render();
    };
    var cancel = document.createElement("button"); cancel.type = "button"; cancel.className = "cta alt"; cancel.textContent = "Discard";
    cancel.onclick = function () { host.textContent = ""; if (host.id === "scan") closeSheet(); };
    acts.append(addAll, cancel); host.appendChild(acts);
  }

  function setupText(sample) {
    aiMode = true;
    $("manual").hidden = true; $("aihint").hidden = false; $("submitbtn").textContent = "Analyze with Claude";
    $("food").placeholder = "e.g. 2 eggs and toast with butter";
    var out = $("textout"), busy = false;
    var ERR = { not_granted: "Food analysis is turned off for this page. Allow Claude in the page permissions.", rate_limited: "Too many requests. Wait a moment and try again." };
    window.__analyze = async function (name) {
      if (busy) return; busy = true;
      out.textContent = "";
      var p = document.createElement("div"); p.className = "scan-status";
      var sp = document.createElement("div"); sp.className = "spinner"; p.appendChild(sp); p.appendChild(document.createTextNode("Looking up " + name + "…"));
      out.appendChild(p);
      try {
        var base = "A person logged this food in a calorie tracker: \"" + name.replace(/"/g, "'") + "\". Estimate calories and grams of protein, carbs and fat. Use the amount they gave; if none, assume one typical serving and state its weight in grams. If several foods are listed, return one item per food. " + RULES;
        var res = await sample.json(base, { modelTier: "default" });
        renderResults(out, res, null, function (hint, prev) {
          return sample.json(base + "\n\nYour previous answer was: " + JSON.stringify(prev) + "\nThe person corrected you: \"" + hint.replace(/"/g, "'") + "\". Redo the estimate and follow the correction exactly.", { modelTier: "default", cache: false });
        });
      } catch (e) {
        out.textContent = "";
        var m = document.createElement("div"); m.className = "scan-status err";
        m.textContent = ERR[e && e.code] || "Could not analyze that. Try again or rephrase."; out.appendChild(m);
      }
      busy = false;
    };
  }

  (async function initSync() {
    try {
      if (!window.claude || !claude.use) return;
      var db = await claude.use("db"), user = await claude.use("user");
      if (!db || !user) return;
      var uid = await user.id();
      if (!uid) return;
      var base = "data/users/" + uid;
      var refs = { entries: db.collection(base + "/tracker/entries"), settings: db.collection(base + "/tracker/settings") };
      var first = true;
      refs.settings.doc("main").onSnapshot(function (s) {
        if (s.exists && s.data() && s.data().goal) { state.goal = s.data().goal; save(); render(); }
      });
      refs.entries.onSnapshot(function (snap) {
        var days = {};
        snap.docs.forEach(function (d) {
          var v = d.data(); if (!v || !v.day) return;
          (days[v.day] = days[v.day] || []).push({ id: d.id, name: v.name, kcal: v.kcal, meal: v.meal, p: v.p || 0, c: v.c || 0, f: v.f || 0 });
        });
        if (first) {
          first = false;
          Object.keys(state.days).forEach(function (day) {
            state.days[day].forEach(function (e) {
              if (!snap.docs.some(function (d) { return d.id === e.id; })) {
                refs.entries.doc(e.id).set(pack(day, e)).catch(function () {});
                (days[day] = days[day] || []).push(e);
              }
            });
          });
        }
        state.days = days; save(); render();
      }, function () { $("sync").textContent = "Sync unavailable. Saved on this device only."; });
      dbRefs = refs;
      $("sync").textContent = "Synced across your devices";
    } catch (e) {}
  })();

  (async function initScan() {
    try {
      if (!window.claude || !claude.use) return;
      var sample = await claude.use("sample");
      if (!sample) return;
      setupText(sample);
      var caps = await sample.limits().catch(function () { return null; });
      if (!caps || !caps.images) return;
      $("scantab").hidden = false;
      var scan = $("scan");

      function shrink(file) {
        return new Promise(function (resolve, reject) {
          var url = URL.createObjectURL(file), img = new Image();
          img.onload = function () {
            var s = Math.min(1, 1024 / Math.max(img.width, img.height));
            var c = document.createElement("canvas");
            c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            c.toBlob(function (b) { b ? resolve({ blob: b, url: url }) : reject(new Error("blob")); }, "image/jpeg", 0.85);
          };
          img.onerror = function () { reject(new Error("img")); };
          img.src = url;
        });
      }
      function status(msg, err, spin) {
        var p = document.createElement("div"); p.className = "scan-status" + (err ? " err" : "");
        if (spin) { var s = document.createElement("div"); s.className = "spinner"; p.appendChild(s); }
        p.appendChild(document.createTextNode(msg)); return p;
      }
      var ERR = {
        not_granted: "Photo scan is turned off for this page. Allow Claude in the page permissions to use it.",
        rate_limited: "Too many scans in a row. Wait a moment and try again.",
        cancelled: "Scan cancelled."
      };

      $("photo").addEventListener("change", async function (ev) {
        var file = ev.target.files && ev.target.files[0];
        ev.target.value = "";
        if (!file) return;
        scan.textContent = ""; openSheet("scan");
        var small;
        try { small = await shrink(file); } catch (e) { scan.appendChild(status("Could not read that photo. Try another one.", true)); return; }
        var pic = document.createElement("img"); pic.className = "scan-img"; pic.src = small.url; pic.alt = "Your meal";
        scan.appendChild(pic);
        scan.appendChild(status("Claude is looking at your meal…", false, true));
        try {
          var pbase = "This photo shows a meal or food. Identify each distinct food item and estimate its calories, protein, carbs and fat for the portion visible. Use plate size, utensils and the amount of food as scale for weights. " + RULES;
          var res = await sample.json(pbase, { images: small.blob, modelTier: "default", cache: false });
          renderResults(scan, res, pic, function (hint, prev) {
            return sample.json(pbase + "\n\nYour previous answer was: " + JSON.stringify(prev) + "\nThe person corrected you: \"" + hint.replace(/"/g, "'") + "\". Look at the photo again, redo the estimate and follow the correction exactly.", { images: small.blob, modelTier: "default", cache: false });
          });
        } catch (e) {
          scan.textContent = ""; scan.appendChild(pic);
          scan.appendChild(status(ERR[e && e.code] || "Could not analyze that photo. Try again or add the food by hand.", true));
        }
      });
    } catch (e) {}
  })();

  render();
})();
</script>
