<title>Calorie Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap">
<style>
/* Layout: no cards. One column on black, hairline dividers, a huge "kcal left" number, a thin meter, flat lists, two pill buttons at the bottom. Neon lime is the only accent. */
:root {
  --bg: #0a0a0a; --surface: #141414; --fg: #f2f2ef; --muted: #7d7d78; --line: #242424;
  --accent: #c8ff2e; --accent-fg: #0a0a0a; --hero: #c8ff2e; --over: #ff6a55; --track: #1e1e1e; --scrim: rgba(0,0,0,.6);
  --display: "Space Grotesk", system-ui, sans-serif; --body: "Inter", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #fafaf7; --surface: #ffffff; --fg: #111111; --muted: #85857f; --line: #e5e5df;
    --accent: #b6f01a; --accent-fg: #111111; --hero: #111111; --over: #e0442f; --track: #ececE6; --scrim: rgba(0,0,0,.35); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #fafaf7; --surface: #ffffff; --fg: #111111; --muted: #85857f; --line: #e5e5df;
  --accent: #b6f01a; --accent-fg: #111111; --hero: #111111; --over: #e0442f; --track: #ececE6; --scrim: rgba(0,0,0,.35); color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.4;
  padding-block: 20px 140px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 44px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; transition: opacity .15s, transform .15s; }
button:active { opacity: .6; transform: scale(.97); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.num { font-variant-numeric: tabular-nums; }
.label { font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; }
.top .when { font-family: var(--display); font-size: 15px; font-weight: 500; }
.top .when span { color: var(--muted); margin-left: 8px; font-family: var(--body); font-weight: 400; }
.nav { display: flex; gap: 4px; }
.nav button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); font-size: 18px; color: var(--fg); }
.nav button:disabled { opacity: .25; }

/* Hero */
.hero { display: flex; flex-direction: column; gap: 14px; }
.bignum { font-family: var(--display); font-weight: 500; font-size: clamp(76px, 24vw, 120px); line-height: .9; letter-spacing: -.045em; color: var(--hero); }
.bignum.over { color: var(--over); }
.sub { color: var(--muted); }
.meter { height: 3px; background: var(--track); border-radius: 2px; overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .6s cubic-bezier(.3,1,.4,1); }
.meter.over i { background: var(--over); }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 6px; }
.stats3 div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stats3 b, .stats3 input { font-family: var(--display); font-size: 22px; font-weight: 500; }
.stats3 input { width: 100%; border: 0; background: none; padding: 0; border-bottom: 1px dashed var(--line); outline: none; -moz-appearance: textfield; }
.stats3 input:focus { border-bottom-color: var(--accent); }
.stats3 input::-webkit-outer-spin-button, .stats3 input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* Log */
h2 { margin: 0 0 14px; font-family: var(--display); font-weight: 500; font-size: 15px; display: flex; justify-content: space-between; }
.group { margin-bottom: 26px; }
.group-head { display: flex; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px solid var(--fg); }
.row { display: flex; align-items: baseline; gap: 12px; width: 100%; text-align: left; padding: 13px 0; border-bottom: 1px solid var(--line); }
.row .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row .kcal { color: var(--muted); font-family: var(--display); }
.row .del { display: none; color: var(--over); font-weight: 500; }
.row.open .del { display: block; }
.row.open .kcal { display: none; }
.empty { color: var(--muted); padding: 24px 0; border-top: 1px solid var(--fg); }
.empty b { display: block; color: var(--fg); font-family: var(--display); font-weight: 500; font-size: 18px; margin-bottom: 2px; }

/* Week */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; height: 120px; border-bottom: 1px solid var(--line); }
.bar-col { min-width: 0; }
.bar-col button { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 8px; }
.bar { width: 100%; max-width: 22px; background: var(--track); border-radius: 3px 3px 0 0; min-height: 3px; transition: height .4s ease; }
.bar-col.sel .bar { background: var(--accent); }
.bar.over { background: var(--over); }
.wk-labels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; margin-top: 8px; text-align: center; font-size: 11px; color: var(--muted); }
.wk-labels .sel { color: var(--fg); font-weight: 600; }
.avg { color: var(--muted); margin-top: 16px; }
.sync { color: var(--muted); font-size: 12px; text-align: center; }

/* Bottom buttons */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; pointer-events: none;
  padding: 40px max(20px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 40%, transparent); }
.dock-in { pointer-events: auto; display: flex; gap: 10px; width: 100%; max-width: 520px; }
.pill { display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 27px; font-weight: 600; font-size: 15px; cursor: pointer; }
.pill svg { width: 20px; height: 20px; }
.pill.main { flex: 1; background: var(--accent); color: var(--accent-fg); }
.pill.ghost { padding: 0 22px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }

/* Sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .25s; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; display: flex; justify-content: center; transform: translateY(105%); transition: transform .35s cubic-bezier(.3,.9,.3,1); pointer-events: none; }
.sheet-in { pointer-events: auto; width: 100%; max-width: 520px; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 22px 22px 0 0; padding: 22px max(20px, env(safe-area-inset-left, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 90%; overflow-y: auto; }
body.sheet-open .scrim { opacity: 1; pointer-events: auto; }
body.sheet-open .sheet { transform: none; pointer-events: auto; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.sheet-head h3 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 22px; }
.link { color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 14px; }
.chip span { color: var(--muted); margin-left: 6px; }
.field { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); }
.field label { width: 76px; flex: none; color: var(--muted); font-size: 13px; }
.field input { flex: 1; min-width: 0; border: 0; background: none; padding: 16px 0; outline: none; font-size: 17px; }
.field:focus-within { border-bottom-color: var(--accent); }
.seg { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
.seg button { border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
.cta { display: block; width: 100%; background: var(--accent); color: var(--accent-fg); border-radius: 27px; height: 54px; font-weight: 600; font-size: 15px; }
.cta.alt { background: none; border: 1px solid var(--line); color: var(--fg); }
.scan-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 14px; margin-bottom: 16px; }
.scan-status { color: var(--muted); text-align: center; padding: 14px 0; }
.scan-status.err { color: var(--over); }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--track); border-top-color: var(--accent); margin: 0 auto 10px; animation: spin .8s linear infinite; }
.scan-item input.k { flex: none; width: 70px; text-align: right; color: var(--muted); font-family: var(--display); }
.scan-item .del { color: var(--over); font-size: 20px; }
.scan-actions { display: grid; gap: 10px; margin-top: 18px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<main>
  <div class="top">
    <div class="when"><span style="margin:0;color:inherit;font-family:inherit;font-weight:inherit" id="title">Today</span><span id="eyebrow"></span></div>
    <div class="nav">
      <button id="prev" aria-label="Previous day">‹</button>
      <button id="next" aria-label="Next day">›</button>
    </div>
  </div>

  <section class="hero" aria-label="Daily summary">
    <div class="label" id="remlabel">kcal left</div>
    <div class="bignum num" id="remaining">2,000</div>
    <div class="meter" id="meter"><i id="arc"></i></div>
    <div class="stats3">
      <div><span class="label">Eaten</span><b class="num" id="eaten">0</b></div>
      <div><span class="label">Goal</span><input id="goal" type="number" inputmode="numeric" min="500" max="10000" step="50" aria-label="Daily goal in kcal"></div>
      <div><span class="label">Meals</span><b class="num" id="count">0</b></div>
    </div>
  </section>

  <section>
    <h2 id="logtitle">Today</h2>
    <div id="log"></div>
  </section>

  <section>
    <h2>Last 7 days</h2>
    <div class="week" id="week"></div>
    <div class="wk-labels" id="wklabels"></div>
    <div class="avg num" id="avg"></div>
  </section>
  <div class="sync" id="sync">Saved on this device only</div>
</main>

<div class="dock"><div class="dock-in">
  <label class="pill ghost" id="scantab" for="photo" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>Scan
  </label>
  <button class="pill main" id="addtab" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add food
  </button>
</div></div>
<input id="photo" type="file" accept="image/*" hidden>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" aria-hidden="true"><div class="sheet-in" role="dialog" aria-modal="true">
  <div id="panel-add">
    <div class="sheet-head"><h3>Add food</h3><button class="link" type="button" data-close>Cancel</button></div>
    <div class="chips" id="chips"></div>
    <form id="form">
      <div class="field"><label for="food">Food</label><input id="food" placeholder="What did you eat?" required maxlength="80" autocomplete="off"></div>
      <div class="field"><label for="cal">Calories</label><input id="cal" type="number" inputmode="numeric" min="1" max="5000" placeholder="kcal" required></div>
      <div class="seg" id="seg" role="group" aria-label="Meal">
        <button type="button" aria-pressed="false">Breakfast</button><button type="button" aria-pressed="false">Lunch</button><button type="button" aria-pressed="false">Dinner</button><button type="button" aria-pressed="false">Snack</button>
      </div>
      <button class="cta" type="submit">Add to log</button>
    </form>
  </div>
  <div id="panel-scan" hidden>
    <div class="sheet-head"><h3>Scan meal</h3><button class="link" type="button" data-close>Close</button></div>
    <div id="scan"></div>
  </div>
</div></div>

<script>
(function () {
  var KEY = "calorie-tracker-v1";
  var MEALS = ["Breakfast", "Lunch", "Dinner", "Snack"];
  var QUICK = [["Egg", 78], ["Banana", 105], ["Rice, 1 cup", 205], ["Chicken breast", 165], ["Apple", 95], ["Coffee with milk", 40]];
  var state = { goal: 2000, days: {} };
  try { var raw = localStorage.getItem(KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  var dbRefs = null;
  var meal = "Breakfast";

  function $(id) { return document.getElementById(id); }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  var todayStr = iso(new Date());
  var current = todayStr;
  function total(day) { return (state.days[day] || []).reduce(function (a, e) { return a + e.kcal; }, 0); }
  function fmt(n) { return Math.round(n).toLocaleString(); }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function label(day) {
    if (day === todayStr) return "Today";
    var y = new Date(); y.setDate(y.getDate() - 1);
    if (day === iso(y)) return "Yesterday";
    return parse(day).toLocaleDateString(undefined, { weekday: "long" });
  }

  function addEntry(day, e) {
    (state.days[day] = state.days[day] || []).push(e);
    save();
    if (dbRefs) dbRefs.entries.doc(e.id).set({ day: day, name: e.name, kcal: e.kcal, meal: e.meal }).catch(function () {});
  }
  function removeEntry(day, id) {
    state.days[day] = (state.days[day] || []).filter(function (x) { return x.id !== id; });
    if (!state.days[day].length) delete state.days[day];
    save();
    if (dbRefs) dbRefs.entries.doc(id).delete().catch(function () {});
  }
  function setGoal(g) {
    state.goal = g; save();
    if (dbRefs) dbRefs.settings.doc("main").set({ goal: g }).catch(function () {});
  }

  function openSheet(panel) {
    $("panel-add").hidden = panel !== "add";
    $("panel-scan").hidden = panel !== "scan";
    document.body.classList.add("sheet-open");
    $("sheet").setAttribute("aria-hidden", "false");
    if (panel === "add") setTimeout(function () { $("food").focus(); }, 350);
  }
  function closeSheet() {
    document.body.classList.remove("sheet-open");
    $("sheet").setAttribute("aria-hidden", "true");
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  $("scrim").onclick = closeSheet;
  document.querySelectorAll("[data-close]").forEach(function (b) { b.onclick = closeSheet; });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeSheet(); });
  $("addtab").onclick = function () { openSheet("add"); };

  var segBtns = $("seg").querySelectorAll("button");
  function setMeal(m) {
    meal = m;
    segBtns.forEach(function (b) { b.setAttribute("aria-pressed", b.textContent === m ? "true" : "false"); });
  }
  segBtns.forEach(function (b) { b.onclick = function () { setMeal(b.textContent); }; });
  var hr = new Date().getHours();
  setMeal(hr < 11 ? "Breakfast" : hr < 15 ? "Lunch" : hr < 20 ? "Dinner" : "Snack");

  QUICK.forEach(function (q) {
    var c = document.createElement("button"); c.type = "button"; c.className = "chip";
    c.textContent = q[0]; var s = document.createElement("span"); s.textContent = q[1]; c.appendChild(s);
    c.onclick = function () { $("food").value = q[0]; $("cal").value = q[1]; $("cal").focus(); };
    $("chips").appendChild(c);
  });

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var name = $("food").value.trim(), kcal = parseInt($("cal").value, 10);
    if (!name || !(kcal > 0)) return;
    addEntry(current, { id: newId(), name: name, kcal: kcal, meal: meal });
    $("food").value = ""; $("cal").value = "";
    closeSheet(); render();
  });

  $("goal").addEventListener("change", function () {
    var g = parseInt($("goal").value, 10);
    if (g >= 500 && g <= 10000) setGoal(g);
    render();
  });
  $("prev").onclick = function () { var d = parse(current); d.setDate(d.getDate() - 1); current = iso(d); render(); };
  $("next").onclick = function () { var d = parse(current); d.setDate(d.getDate() + 1); if (iso(d) <= todayStr) { current = iso(d); render(); } };

  function render() {
    var entries = state.days[current] || [];
    var sum = total(current), goal = state.goal, over = sum > goal;
    $("title").textContent = label(current);
    $("eyebrow").textContent = parse(current).toLocaleDateString(undefined, { month: "short", day: "numeric" });
    $("logtitle").textContent = current === todayStr ? "Today's meals" : label(current) + "'s meals";
    $("next").disabled = current >= todayStr;
    $("eaten").textContent = fmt(sum);
    if (document.activeElement !== $("goal")) $("goal").value = goal;
    $("arc").style.width = Math.min(sum / goal, 1) * 100 + "%";
    $("meter").classList.toggle("over", over);
    $("remlabel").textContent = over ? "kcal over goal" : "kcal left";
    $("remaining").textContent = fmt(Math.abs(goal - sum));
    $("remaining").classList.toggle("over", over);
    $("count").textContent = entries.length;

    var log = $("log"); log.innerHTML = "";
    if (!entries.length) {
      log.innerHTML = '<div class="empty"><b>Nothing logged yet</b>Tap Add food to log your first meal.</div>';
    } else {
      MEALS.forEach(function (m) {
        var items = entries.filter(function (e) { return e.meal === m; });
        if (!items.length) return;
        var g = document.createElement("div"); g.className = "group";
        var head = document.createElement("div"); head.className = "group-head label";
        var hl = document.createElement("span"); hl.textContent = m;
        var hr2 = document.createElement("span"); hr2.className = "num";
        hr2.textContent = fmt(items.reduce(function (a, e) { return a + e.kcal; }, 0)) + " kcal";
        head.append(hl, hr2); g.appendChild(head);
        items.forEach(function (e) {
          var row = document.createElement("button"); row.type = "button"; row.className = "row";
          row.setAttribute("aria-label", e.name + ", " + e.kcal + " kcal. Tap for delete.");
          var n = document.createElement("span"); n.className = "name"; n.textContent = e.name;
          var k = document.createElement("span"); k.className = "kcal num"; k.textContent = fmt(e.kcal);
          var d = document.createElement("span"); d.className = "del"; d.textContent = "Delete";
          row.append(n, k, d);
          row.onclick = function () {
            if (row.classList.contains("open")) { removeEntry(current, e.id); render(); }
            else {
              log.querySelectorAll(".row.open").forEach(function (r) { r.classList.remove("open"); });
              row.classList.add("open");
            }
          };
          g.appendChild(row);
        });
        log.appendChild(g);
      });
    }
    renderWeek();
  }

  function renderWeek() {
    var wk = $("week"), wl = $("wklabels"); wk.innerHTML = ""; wl.innerHTML = "";
    var end = parse(current), days = [], i;
    for (i = 6; i >= 0; i--) { var d = new Date(end); d.setDate(d.getDate() - i); days.push(iso(d)); }
    var vals = days.map(total);
    var max = Math.max.apply(null, vals.concat([state.goal]));
    days.forEach(function (day, idx) {
      var v = vals[idx];
      var col = document.createElement("div"); col.className = "bar-col" + (day === current ? " sel" : "");
      var b = document.createElement("button"); b.type = "button";
      b.setAttribute("aria-label", label(day) + ": " + fmt(v) + " kcal");
      var bar = document.createElement("div"); bar.className = "bar" + (v > state.goal ? " over" : "");
      bar.style.height = (v ? Math.max(v / max * 100, 3) : 3) + "%";
      b.appendChild(bar); col.appendChild(b); wk.appendChild(col);
      b.onclick = function () { current = day; render(); };
      var l = document.createElement("span"); if (day === current) l.className = "sel";
      l.textContent = parse(day).toLocaleDateString(undefined, { weekday: "narrow" });
      wl.appendChild(l);
    });
    var logged = vals.filter(function (v) { return v > 0; });
    $("avg").textContent = logged.length
      ? "Average " + fmt(logged.reduce(function (a, b) { return a + b; }, 0) / logged.length) + " kcal on logged days"
      : "Log a few days to see your average.";
  }

  (async function initSync() {
    try {
      if (!window.claude || !claude.use) return;
      var db = await claude.use("db"), user = await claude.use("user");
      if (!db || !user) return;
      var uid = await user.id();
      if (!uid) return;
      var base = "data/users/" + uid;
      var refs = { entries: db.collection(base + "/entries"), settings: db.collection(base + "/settings") };
      var first = true;
      refs.settings.doc("main").onSnapshot(function (s) {
        if (s.exists && s.data() && s.data().goal) { state.goal = s.data().goal; save(); render(); }
      });
      refs.entries.onSnapshot(function (snap) {
        var days = {};
        snap.docs.forEach(function (d) {
          var v = d.data(); if (!v || !v.day) return;
          (days[v.day] = days[v.day] || []).push({ id: d.id, name: v.name, kcal: v.kcal, meal: v.meal });
        });
        if (first) {
          first = false;
          Object.keys(state.days).forEach(function (day) {
            state.days[day].forEach(function (e) {
              if (!snap.docs.some(function (d) { return d.id === e.id; })) {
                refs.entries.doc(e.id).set({ day: day, name: e.name, kcal: e.kcal, meal: e.meal }).catch(function () {});
                (days[day] = days[day] || []).push(e);
              }
            });
          });
        }
        state.days = days; save(); render();
      }, function () { $("sync").textContent = "Sync unavailable. Saved on this device only."; });
      dbRefs = refs;
      $("sync").textContent = "Synced across your devices";
    } catch (e) {}
  })();

  (async function initScan() {
    try {
      if (!window.claude || !claude.use) return;
      var sample = await claude.use("sample");
      if (!sample) return;
      var caps = await sample.limits().catch(function () { return null; });
      if (!caps || !caps.images) return;
      $("scantab").hidden = false;
      var scan = $("scan");

      function shrink(file) {
        return new Promise(function (resolve, reject) {
          var url = URL.createObjectURL(file), img = new Image();
          img.onload = function () {
            var s = Math.min(1, 1024 / Math.max(img.width, img.height));
            var c = document.createElement("canvas");
            c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            c.toBlob(function (b) { b ? resolve({ blob: b, url: url }) : reject(new Error("blob")); }, "image/jpeg", 0.85);
          };
          img.onerror = function () { reject(new Error("img")); };
          img.src = url;
        });
      }
      function status(msg, err, spin) {
        var p = document.createElement("div"); p.className = "scan-status" + (err ? " err" : "");
        if (spin) { var s = document.createElement("div"); s.className = "spinner"; p.appendChild(s); }
        p.appendChild(document.createTextNode(msg)); return p;
      }
      var ERR = {
        not_granted: "Photo scan is turned off for this page. Allow Claude in the page permissions to use it.",
        rate_limited: "Too many scans in a row. Wait a moment and try again.",
        cancelled: "Scan cancelled."
      };

      $("photo").addEventListener("change", async function (ev) {
        var file = ev.target.files && ev.target.files[0];
        ev.target.value = "";
        if (!file) return;
        scan.textContent = ""; openSheet("scan");
        var small;
        try { small = await shrink(file); } catch (e) { scan.appendChild(status("Could not read that photo. Try another one.", true)); return; }
        var pic = document.createElement("img"); pic.className = "scan-img"; pic.src = small.url; pic.alt = "Your meal";
        scan.appendChild(pic);
        scan.appendChild(status("Claude is looking at your meal…", false, true));
        try {
          var res = await sample.json(
            "This photo shows a meal or food. Identify each distinct food item and estimate its calories for the portion visible. " +
            "Reply with only JSON: {\"items\":[{\"name\":string,\"kcal\":integer}],\"note\":string}. " +
            "Use short names with portion size, like \"Fried rice, 1 plate\". If there is no food, return an empty items array and explain in note.",
            { images: small.blob, modelTier: "quick", cache: false }
          );
          var items = (res && res.items || []).filter(function (it) { return it && it.name && it.kcal > 0; });
          scan.textContent = ""; scan.appendChild(pic);
          if (!items.length) { scan.appendChild(status((res && res.note) || "No food found in that photo.", true)); return; }
          var fl = document.createElement("div");
          items.forEach(function (it) {
            var row = document.createElement("div"); row.className = "field scan-item";
            var n = document.createElement("input"); n.value = it.name; n.maxLength = 80; n.setAttribute("aria-label", "Food name");
            var k = document.createElement("input"); k.type = "number"; k.className = "k"; k.min = 1; k.value = Math.round(it.kcal); k.setAttribute("aria-label", "Calories");
            var x = document.createElement("button"); x.type = "button"; x.className = "del"; x.textContent = "×"; x.setAttribute("aria-label", "Remove item");
            x.onclick = function () { row.remove(); };
            row.append(n, k, x); fl.appendChild(row);
          });
          scan.appendChild(fl);
          if (res.note) scan.appendChild(status(res.note));
          var acts = document.createElement("div"); acts.className = "scan-actions";
          var addAll = document.createElement("button"); addAll.type = "button"; addAll.className = "cta"; addAll.textContent = "Add to " + meal.toLowerCase();
          addAll.onclick = function () {
            fl.querySelectorAll(".scan-item").forEach(function (row) {
              var ins = row.querySelectorAll("input"), kc = parseInt(ins[1].value, 10), nm = ins[0].value.trim();
              if (nm && kc > 0) addEntry(current, { id: newId(), name: nm, kcal: kc, meal: meal });
            });
            closeSheet(); render();
          };
          var cancel = document.createElement("button"); cancel.type = "button"; cancel.className = "cta alt"; cancel.textContent = "Discard";
          cancel.onclick = closeSheet;
          acts.append(addAll, cancel); scan.appendChild(acts);
        } catch (e) {
          scan.textContent = ""; scan.appendChild(pic);
          scan.appendChild(status(ERR[e && e.code] || "Could not analyze that photo. Try again or add the food by hand.", true));
        }
      });
    } catch (e) {}
  })();

  render();
})();
</script>
