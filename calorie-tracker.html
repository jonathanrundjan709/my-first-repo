<title>Calorie Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: iOS grouped-list style. Large title, activity ring hero, inset grouped meal lists, floating blurred tab bar, bottom sheets. */
:root {
  --bg: #f2f2f7; --card: #ffffff; --fg: #000000; --muted: #8a8a8e; --sep: rgba(60,60,67,.16);
  --blue: #007aff; --red: #ff3b30; --green: #34c759; --fill: rgba(118,118,128,.12);
  --ring-a: #ff2d55; --ring-b: #ff9f0a; --ring-track: rgba(255,45,85,.16);
  --bar: rgba(249,249,251,.78); --scrim: rgba(0,0,0,.35); --on-blue: #ffffff;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1c1c1e; --fg: #ffffff; --muted: #98989f; --sep: rgba(84,84,88,.55);
    --blue: #0a84ff; --red: #ff453a; --green: #30d158; --fill: rgba(118,118,128,.24);
    --ring-a: #ff375f; --ring-b: #ffb340; --ring-track: rgba(255,55,95,.22);
    --bar: rgba(28,28,30,.78); --scrim: rgba(0,0,0,.55); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --fg: #ffffff; --muted: #98989f; --sep: rgba(84,84,88,.55);
  --blue: #0a84ff; --red: #ff453a; --green: #30d158; --fill: rgba(118,118,128,.24);
  --ring-a: #ff375f; --ring-b: #ffb340; --ring-track: rgba(255,55,95,.22);
  --bar: rgba(28,28,30,.78); --scrim: rgba(0,0,0,.55); color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 17px; line-height: 1.3; letter-spacing: -.01em;
  padding-block: 16px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; transition: transform .15s ease, opacity .15s ease; }
button:active { transform: scale(.96); opacity: .7; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 8px; }
.eyebrow { color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; }
.nav { display: flex; gap: 8px; }
.circle { width: 34px; height: 34px; border-radius: 50%; background: var(--fill); display: grid; place-items: center; color: var(--blue); font-size: 20px; font-weight: 600; line-height: 1; }
.circle:disabled { opacity: .3; }

/* Hero */
.hero { background: var(--card); border-radius: 22px; padding: 20px 16px 16px; }
.ring { position: relative; width: 190px; height: 190px; margin: 4px auto 18px; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .big { font-size: 46px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.ring .small { color: var(--muted); font-size: 13px; font-weight: 500; margin-top: 4px; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); border-top: .5px solid var(--sep); padding-top: 14px; }
.trio > div { text-align: center; min-width: 0; }
.trio > div + div { border-left: .5px solid var(--sep); }
.trio .lab { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
.trio .val { font-size: 20px; font-weight: 600; margin-top: 2px; }
.trio input { width: 100%; text-align: center; border: 0; background: none; padding: 0; font-size: 20px; font-weight: 600; color: var(--blue); margin-top: 2px; -moz-appearance: textfield; }
.trio input::-webkit-outer-spin-button, .trio input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.over { color: var(--red); }

/* Grouped lists */
.section-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 8px; }
.group { margin-bottom: 18px; }
.group-head { display: flex; justify-content: space-between; padding: 0 16px 6px; color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
.list { background: var(--card); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; position: relative; width: 100%; text-align: left; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
.row .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row .kcal { color: var(--muted); }
.row .del { color: var(--red); font-weight: 600; display: none; }
.row.open .del { display: block; }
.row.open .kcal { display: none; }
.empty { background: var(--card); border-radius: 14px; padding: 28px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-size: 17px; margin-bottom: 4px; }

/* Week */
.week-card { background: var(--card); border-radius: 22px; padding: 16px; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 140px; }
.bar-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; min-width: 0; }
.bar-col button { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 600; }
.track { flex: 1; width: 100%; max-width: 30px; display: flex; align-items: flex-end; background: var(--fill); border-radius: 15px; overflow: hidden; }
.fill { width: 100%; border-radius: 15px; background: linear-gradient(180deg, var(--ring-b), var(--ring-a)); min-height: 6px; transition: height .4s cubic-bezier(.3,1.3,.5,1); }
.fill.none { background: transparent; }
.bar-col.sel .lbl { color: var(--fg); }
.bar-col.sel .lbl::after { content: ""; display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--blue); margin: 3px auto 0; }
.avg { color: var(--muted); font-size: 15px; margin-top: 14px; text-align: center; }
.sync { color: var(--muted); font-size: 12px; text-align: center; }

/* Floating tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-left, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
.tabs { pointer-events: auto; display: flex; gap: 6px; padding: 6px; background: var(--bar); border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.18), 0 0 0 .5px var(--sep);
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%); }
.tab { display: flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 999px; font-weight: 600; font-size: 16px; color: var(--blue); }
.tab.main { background: var(--blue); color: var(--on-blue); }
.tab svg { width: 20px; height: 20px; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .25s ease; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; display: flex; justify-content: center; transform: translateY(105%); transition: transform .38s cubic-bezier(.32,.72,0,1); pointer-events: none; }
.sheet-in { pointer-events: auto; width: 100%; max-width: 560px; background: var(--bg); border-radius: 24px 24px 0 0; padding: 8px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); max-height: 90%; overflow-y: auto; }
body.sheet-open .scrim { opacity: 1; pointer-events: auto; }
body.sheet-open .sheet { transform: none; pointer-events: auto; }
.grab { width: 36px; height: 5px; border-radius: 3px; background: var(--sep); margin: 0 auto 10px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.sheet-head h3 { margin: 0; font-size: 20px; font-weight: 700; }
.link { color: var(--blue); font-weight: 600; }
.field-list { background: var(--card); border-radius: 14px; overflow: hidden; }
.field { display: flex; align-items: center; gap: 12px; padding: 0 16px; min-height: 48px; position: relative; }
.field + .field::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--sep); }
.field label { width: 64px; flex: none; color: var(--muted); }
.field input { flex: 1; min-width: 0; border: 0; background: none; padding: 12px 0; outline: none; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--fill); border-radius: 9px; padding: 2px; margin: 14px 0; }
.seg button { padding: 7px 0; border-radius: 7px; font-size: 14px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--card); font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.cta { display: block; width: 100%; background: var(--blue); color: var(--on-blue); border-radius: 14px; padding: 15px; font-weight: 600; text-align: center; }
.cta.alt { background: var(--fill); color: var(--blue); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; background: var(--card); border-radius: 999px; padding: 8px 14px; font-size: 15px; }
.chip span { color: var(--muted); margin-left: 4px; }
.scan-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 14px; margin-bottom: 14px; }
.scan-status { color: var(--muted); text-align: center; padding: 14px 0; }
.scan-status.err { color: var(--red); }
.spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--fill); border-top-color: var(--blue); margin: 0 auto 10px; animation: spin .8s linear infinite; }
.scan-item input.k { width: 72px; flex: none; text-align: right; color: var(--muted); }
.scan-item .del { color: var(--red); font-size: 20px; padding: 0 0 0 6px; }
.scan-actions { display: grid; gap: 10px; margin-top: 14px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<main>
  <header>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title">Today</h1>
    </div>
    <div class="nav">
      <button class="circle" id="prev" aria-label="Previous day">‹</button>
      <button class="circle" id="next" aria-label="Next day">›</button>
    </div>
  </header>

  <section class="hero" aria-label="Daily summary">
    <div class="ring">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--ring-a)"/><stop offset="1" stop-color="var(--ring-b)"/></linearGradient></defs>
        <circle cx="60" cy="60" r="50" fill="none" stroke="var(--ring-track)" stroke-width="14"/>
        <circle id="arc" cx="60" cy="60" r="50" fill="none" stroke="url(#grad)" stroke-width="14" stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16" style="transition:stroke-dashoffset .8s cubic-bezier(.3,1.2,.5,1)"/>
      </svg>
      <div class="center"><div class="big num" id="eaten">0</div><div class="small">of <span id="goaltext">2,000</span> kcal</div></div>
    </div>
    <div class="trio">
      <div><div class="lab">Goal</div><input id="goal" type="number" inputmode="numeric" min="500" max="10000" step="50" aria-label="Daily goal in kcal"></div>
      <div><div class="lab" id="remlabel">Left</div><div class="val num" id="remaining">0</div></div>
      <div><div class="lab">Meals</div><div class="val num" id="count">0</div></div>
    </div>
  </section>

  <section>
    <h2 class="section-title" id="logtitle">Today</h2>
    <div id="log"></div>
  </section>

  <section>
    <h2 class="section-title">Last 7 days</h2>
    <div class="week-card">
      <div class="week" id="week"></div>
      <div class="avg num" id="avg"></div>
    </div>
  </section>
  <div class="sync" id="sync">Saved on this device only</div>
</main>

<div class="tabbar"><div class="tabs">
  <label class="tab" id="scantab" for="photo" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L17 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>Scan
  </label>
  <button class="tab main" id="addtab" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add food
  </button>
</div></div>
<input id="photo" type="file" accept="image/*" hidden>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" aria-hidden="true"><div class="sheet-in" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div id="panel-add">
    <div class="sheet-head"><h3>Add food</h3><button class="link" type="button" data-close>Cancel</button></div>
    <div class="chips" id="chips"></div>
    <form id="form">
      <div class="field-list">
        <div class="field"><label for="food">Food</label><input id="food" placeholder="What did you eat?" required maxlength="80" autocomplete="off"></div>
        <div class="field"><label for="cal">Calories</label><input id="cal" type="number" inputmode="numeric" min="1" max="5000" placeholder="kcal" required></div>
      </div>
      <div class="seg" id="seg" role="group" aria-label="Meal">
        <button type="button" aria-pressed="false">Breakfast</button><button type="button" aria-pressed="false">Lunch</button><button type="button" aria-pressed="false">Dinner</button><button type="button" aria-pressed="false">Snack</button>
      </div>
      <button class="cta" type="submit">Add to log</button>
    </form>
  </div>
  <div id="panel-scan" hidden>
    <div class="sheet-head"><h3>Scan meal</h3><button class="link" type="button" data-close>Close</button></div>
    <div id="scan"></div>
  </div>
</div></div>

<script>
(function () {
  var KEY = "calorie-tracker-v1";
  var MEALS = ["Breakfast", "Lunch", "Dinner", "Snack"];
  var QUICK = [["Egg", 78], ["Banana", 105], ["Rice, 1 cup", 205], ["Chicken breast", 165], ["Apple", 95], ["Coffee with milk", 40]];
  var state = { goal: 2000, days: {} };
  try { var raw = localStorage.getItem(KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  var dbRefs = null;
  var meal = "Breakfast";

  function $(id) { return document.getElementById(id); }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  var todayStr = iso(new Date());
  var current = todayStr;
  function total(day) { return (state.days[day] || []).reduce(function (a, e) { return a + e.kcal; }, 0); }
  function fmt(n) { return Math.round(n).toLocaleString(); }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function label(day) {
    if (day === todayStr) return "Today";
    var y = new Date(); y.setDate(y.getDate() - 1);
    if (day === iso(y)) return "Yesterday";
    return parse(day).toLocaleDateString(undefined, { weekday: "long" });
  }

  function addEntry(day, e) {
    (state.days[day] = state.days[day] || []).push(e);
    save();
    if (dbRefs) dbRefs.entries.doc(e.id).set({ day: day, name: e.name, kcal: e.kcal, meal: e.meal }).catch(function () {});
  }
  function removeEntry(day, id) {
    state.days[day] = (state.days[day] || []).filter(function (x) { return x.id !== id; });
    if (!state.days[day].length) delete state.days[day];
    save();
    if (dbRefs) dbRefs.entries.doc(id).delete().catch(function () {});
  }
  function setGoal(g) {
    state.goal = g; save();
    if (dbRefs) dbRefs.settings.doc("main").set({ goal: g }).catch(function () {});
  }

  /* Sheets */
  function openSheet(panel) {
    $("panel-add").hidden = panel !== "add";
    $("panel-scan").hidden = panel !== "scan";
    document.body.classList.add("sheet-open");
    $("sheet").setAttribute("aria-hidden", "false");
    if (panel === "add") setTimeout(function () { $("food").focus(); }, 350);
  }
  function closeSheet() {
    document.body.classList.remove("sheet-open");
    $("sheet").setAttribute("aria-hidden", "true");
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  $("scrim").onclick = closeSheet;
  document.querySelectorAll("[data-close]").forEach(function (b) { b.onclick = closeSheet; });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeSheet(); });
  $("addtab").onclick = function () { openSheet("add"); };

  var segBtns = $("seg").querySelectorAll("button");
  function setMeal(m) {
    meal = m;
    segBtns.forEach(function (b) { b.setAttribute("aria-pressed", b.textContent === m ? "true" : "false"); });
  }
  segBtns.forEach(function (b) { b.onclick = function () { setMeal(b.textContent); }; });
  var hr = new Date().getHours();
  setMeal(hr < 11 ? "Breakfast" : hr < 15 ? "Lunch" : hr < 20 ? "Dinner" : "Snack");

  QUICK.forEach(function (q) {
    var c = document.createElement("button"); c.type = "button"; c.className = "chip";
    c.textContent = q[0]; var s = document.createElement("span"); s.textContent = q[1]; c.appendChild(s);
    c.onclick = function () { $("food").value = q[0]; $("cal").value = q[1]; $("cal").focus(); };
    $("chips").appendChild(c);
  });

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var name = $("food").value.trim(), kcal = parseInt($("cal").value, 10);
    if (!name || !(kcal > 0)) return;
    addEntry(current, { id: newId(), name: name, kcal: kcal, meal: meal });
    $("food").value = ""; $("cal").value = "";
    closeSheet(); render();
  });

  $("goal").addEventListener("change", function () {
    var g = parseInt($("goal").value, 10);
    if (g >= 500 && g <= 10000) setGoal(g);
    render();
  });
  $("prev").onclick = function () { var d = parse(current); d.setDate(d.getDate() - 1); current = iso(d); render(); };
  $("next").onclick = function () { var d = parse(current); d.setDate(d.getDate() + 1); if (iso(d) <= todayStr) { current = iso(d); render(); } };

  /* Render */
  function render() {
    var entries = state.days[current] || [];
    var sum = total(current), goal = state.goal, over = sum > goal;
    $("eyebrow").textContent = parse(current).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
    $("title").textContent = label(current);
    $("logtitle").textContent = current === todayStr ? "Today's meals" : label(current) + "'s meals";
    $("next").disabled = current >= todayStr;
    $("eaten").textContent = fmt(sum);
    $("goaltext").textContent = fmt(goal);
    if (document.activeElement !== $("goal")) $("goal").value = goal;
    $("arc").style.strokeDashoffset = 314.16 * (1 - Math.min(sum / goal, 1));
    $("remlabel").textContent = over ? "Over" : "Left";
    $("remaining").textContent = fmt(Math.abs(goal - sum));
    $("remaining").classList.toggle("over", over);
    $("eaten").classList.toggle("over", over);
    $("count").textContent = entries.length;

    var log = $("log"); log.innerHTML = "";
    if (!entries.length) {
      log.innerHTML = '<div class="empty"><b>Nothing logged yet</b>Tap Add food to log your first meal.</div>';
    } else {
      MEALS.forEach(function (m) {
        var items = entries.filter(function (e) { return e.meal === m; });
        if (!items.length) return;
        var g = document.createElement("div"); g.className = "group";
        var head = document.createElement("div"); head.className = "group-head";
        var hl = document.createElement("span"); hl.textContent = m;
        var hr2 = document.createElement("span"); hr2.className = "num";
        hr2.textContent = fmt(items.reduce(function (a, e) { return a + e.kcal; }, 0)) + " kcal";
        head.append(hl, hr2);
        var list = document.createElement("div"); list.className = "list";
        items.forEach(function (e) {
          var row = document.createElement("button"); row.type = "button"; row.className = "row";
          row.setAttribute("aria-label", e.name + ", " + e.kcal + " kcal. Tap for delete.");
          var n = document.createElement("span"); n.className = "name"; n.textContent = e.name;
          var k = document.createElement("span"); k.className = "kcal num"; k.textContent = fmt(e.kcal);
          var d = document.createElement("span"); d.className = "del"; d.textContent = "Delete";
          row.append(n, k, d);
          row.onclick = function () {
            if (row.classList.contains("open")) { removeEntry(current, e.id); render(); }
            else {
              list.parentNode.parentNode.querySelectorAll(".row.open").forEach(function (r) { r.classList.remove("open"); });
              row.classList.add("open");
            }
          };
          list.appendChild(row);
        });
        g.append(head, list); log.appendChild(g);
      });
    }
    renderWeek();
  }

  function renderWeek() {
    var wk = $("week"); wk.innerHTML = "";
    var end = parse(current), days = [], i;
    for (i = 6; i >= 0; i--) { var d = new Date(end); d.setDate(d.getDate() - i); days.push(iso(d)); }
    var vals = days.map(total);
    var max = Math.max.apply(null, vals.concat([state.goal]));
    days.forEach(function (day, idx) {
      var v = vals[idx];
      var col = document.createElement("div"); col.className = "bar-col" + (day === current ? " sel" : "");
      var b = document.createElement("button"); b.type = "button";
      b.setAttribute("aria-label", label(day) + ": " + fmt(v) + " kcal");
      var track = document.createElement("div"); track.className = "track";
      var fill = document.createElement("div"); fill.className = "fill" + (v ? "" : " none");
      fill.style.height = v ? Math.max(v / max * 100, 6) + "%" : "0";
      track.appendChild(fill);
      var l = document.createElement("span"); l.className = "lbl";
      l.textContent = parse(day).toLocaleDateString(undefined, { weekday: "narrow" });
      b.append(track, l);
      b.onclick = function () { current = day; render(); };
      col.appendChild(b); wk.appendChild(col);
    });
    var logged = vals.filter(function (v) { return v > 0; });
    $("avg").textContent = logged.length
      ? "Average " + fmt(logged.reduce(function (a, b) { return a + b; }, 0) / logged.length) + " kcal on logged days"
      : "Log a few days to see your average.";
  }

  /* Sync */
  (async function initSync() {
    try {
      if (!window.claude || !claude.use) return;
      var db = await claude.use("db"), user = await claude.use("user");
      if (!db || !user) return;
      var uid = await user.id();
      if (!uid) return;
      var base = "data/users/" + uid;
      var refs = { entries: db.collection(base + "/entries"), settings: db.collection(base + "/settings") };
      var first = true;
      refs.settings.doc("main").onSnapshot(function (s) {
        if (s.exists && s.data() && s.data().goal) { state.goal = s.data().goal; save(); render(); }
      });
      refs.entries.onSnapshot(function (snap) {
        var days = {};
        snap.docs.forEach(function (d) {
          var v = d.data(); if (!v || !v.day) return;
          (days[v.day] = days[v.day] || []).push({ id: d.id, name: v.name, kcal: v.kcal, meal: v.meal });
        });
        if (first) {
          first = false;
          Object.keys(state.days).forEach(function (day) {
            state.days[day].forEach(function (e) {
              if (!snap.docs.some(function (d) { return d.id === e.id; })) {
                refs.entries.doc(e.id).set({ day: day, name: e.name, kcal: e.kcal, meal: e.meal }).catch(function () {});
                (days[day] = days[day] || []).push(e);
              }
            });
          });
        }
        state.days = days; save(); render();
      }, function () { $("sync").textContent = "Sync unavailable. Saved on this device only."; });
      dbRefs = refs;
      $("sync").textContent = "Synced across your devices";
    } catch (e) {}
  })();

  /* Photo scan */
  (async function initScan() {
    try {
      if (!window.claude || !claude.use) return;
      var sample = await claude.use("sample");
      if (!sample) return;
      var caps = await sample.limits().catch(function () { return null; });
      if (!caps || !caps.images) return;
      $("scantab").hidden = false;
      var scan = $("scan");

      function shrink(file) {
        return new Promise(function (resolve, reject) {
          var url = URL.createObjectURL(file), img = new Image();
          img.onload = function () {
            var s = Math.min(1, 1024 / Math.max(img.width, img.height));
            var c = document.createElement("canvas");
            c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            c.toBlob(function (b) { b ? resolve({ blob: b, url: url }) : reject(new Error("blob")); }, "image/jpeg", 0.85);
          };
          img.onerror = function () { reject(new Error("img")); };
          img.src = url;
        });
      }
      function status(msg, err, spin) {
        var p = document.createElement("div"); p.className = "scan-status" + (err ? " err" : "");
        if (spin) { var s = document.createElement("div"); s.className = "spinner"; p.appendChild(s); }
        p.appendChild(document.createTextNode(msg)); return p;
      }
      var ERR = {
        not_granted: "Photo scan is turned off for this page. Allow Claude in the page permissions to use it.",
        rate_limited: "Too many scans in a row. Wait a moment and try again.",
        cancelled: "Scan cancelled."
      };

      $("photo").addEventListener("change", async function (ev) {
        var file = ev.target.files && ev.target.files[0];
        ev.target.value = "";
        if (!file) return;
        scan.textContent = ""; openSheet("scan");
        var small;
        try { small = await shrink(file); } catch (e) { scan.appendChild(status("Could not read that photo. Try another one.", true)); return; }
        var pic = document.createElement("img"); pic.className = "scan-img"; pic.src = small.url; pic.alt = "Your meal";
        scan.appendChild(pic);
        scan.appendChild(status("Claude is looking at your meal…", false, true));
        try {
          var res = await sample.json(
            "This photo shows a meal or food. Identify each distinct food item and estimate its calories for the portion visible. " +
            "Reply with only JSON: {\"items\":[{\"name\":string,\"kcal\":integer}],\"note\":string}. " +
            "Use short names with portion size, like \"Fried rice, 1 plate\". If there is no food, return an empty items array and explain in note.",
            { images: small.blob, modelTier: "quick", cache: false }
          );
          var items = (res && res.items || []).filter(function (it) { return it && it.name && it.kcal > 0; });
          scan.textContent = ""; scan.appendChild(pic);
          if (!items.length) { scan.appendChild(status((res && res.note) || "No food found in that photo.", true)); return; }
          var fl = document.createElement("div"); fl.className = "field-list";
          items.forEach(function (it) {
            var row = document.createElement("div"); row.className = "field scan-item";
            var n = document.createElement("input"); n.value = it.name; n.maxLength = 80; n.setAttribute("aria-label", "Food name");
            var k = document.createElement("input"); k.type = "number"; k.className = "k"; k.min = 1; k.value = Math.round(it.kcal); k.setAttribute("aria-label", "Calories");
            var x = document.createElement("button"); x.type = "button"; x.className = "del"; x.textContent = "×"; x.setAttribute("aria-label", "Remove item");
            x.onclick = function () { row.remove(); };
            row.append(n, k, x); fl.appendChild(row);
          });
          scan.appendChild(fl);
          if (res.note) scan.appendChild(status(res.note));
          var acts = document.createElement("div"); acts.className = "scan-actions";
          var addAll = document.createElement("button"); addAll.type = "button"; addAll.className = "cta"; addAll.textContent = "Add to " + meal.toLowerCase();
          addAll.onclick = function () {
            fl.querySelectorAll(".scan-item").forEach(function (row) {
              var ins = row.querySelectorAll("input"), kc = parseInt(ins[1].value, 10), nm = ins[0].value.trim();
              if (nm && kc > 0) addEntry(current, { id: newId(), name: nm, kcal: kc, meal: meal });
            });
            closeSheet(); render();
          };
          var cancel = document.createElement("button"); cancel.type = "button"; cancel.className = "cta alt"; cancel.textContent = "Discard";
          cancel.onclick = closeSheet;
          acts.append(addAll, cancel); scan.appendChild(acts);
        } catch (e) {
          scan.textContent = ""; scan.appendChild(pic);
          scan.appendChild(status(ERR[e && e.code] || "Could not analyze that photo. Try again or add the food by hand.", true));
        }
      });
    } catch (e) {}
  })();

  render();
})();
</script>
